<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML-Clouds and Dog Animation</title>

</head>

<body>
    <h1 align="center">Creating an Animation of Moving Image Clouds and a Dog Using HTML</h1>

    <!--cloude moving left-->

    <marquee direction="left" scrollamount="3">
        <img src="Images/cloud.png" alt="cloud" height="100"> &ensp; &ensp; &ensp; <img src="Images/cloud.png" alt="cloud" height="100"> &ensp; &ensp; &ensp; <img src="Images/cloud.png" alt="cloud" height="100"> &ensp; &ensp; &ensp; <img src="Images/cloud.png" alt="cloud" height="100">
    </marquee> <br>

    <marquee direction="left" scrollamount="4">
        <img src="Images/cloud.png" alt="cloud" height="80"> &ensp; <img src="Images/cloud.png" alt="cloud" height="80"> &ensp; <img src="Images/cloud.png" alt="cloud" height="80">
    </marquee>

    <br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <!-- On a Fixed Road a Dog is Moving Right Side-->
    

    <table border="1" cellpadding="0" cellspacing="0" width="100%" height="200">
        <tr>
            <td bgcolor="grey">
                <marquee direction="right" scrollamount="5">
                    <font size="10" ><img src="Images/icons8-dog-100.png" alt="Walking Dog"></font>
                </marquee>
            </td>
        </tr>
    </table>


</body>

</html>
